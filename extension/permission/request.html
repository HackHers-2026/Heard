<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heard — Microphone access</title>
    <style>
      :root {
        --surface: #ffffff;
        --surface-muted: #f7f6f3;
        --border: #e7e5e4;
        --border-strong: #8f8985;
        --text: #171717;
        --text-secondary: #65615f;
        --accent: #d65d26;
        --accent-strong: #b94418;
        --ok: #2d6a4f;
        --danger: #a63d2f;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--surface-muted);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(27rem, 100%);
        padding: 2.5rem;
        border: 1px solid var(--border);
        border-top: 2px solid var(--accent);
        border-radius: 0;
        background: var(--surface);
        box-shadow: 0 1.25rem 3.5rem rgba(54, 39, 31, 0.08);
      }
      .brand-row { display: flex; align-items: center; gap: 0.65rem; }
      .brand-mark {
        width: 0.5rem;
        height: 1rem;
        display: inline-block;
        border-left: 2px solid var(--accent);
        border-right: 2px solid var(--accent);
        transform: skewY(-18deg);
      }
      .wordmark {
        color: var(--text);
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 2.2rem 0 0;
        font-size: 1.4rem;
        font-weight: 680;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0.55rem 0 0;
        color: var(--text-secondary);
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      .status {
        margin-top: 1.4rem;
        font-size: 0.8125rem;
        font-weight: 620;
        color: var(--text-secondary);
      }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--danger); }
      button {
        margin-top: 1.4rem;
        min-height: 2.65rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 0.25rem;
        background: var(--accent-strong);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 680;
        cursor: pointer;
        transition: background-color 150ms ease;
      }
      button:hover { background: #96350f; }
      button:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
      .hint { font-size: 0.8125rem; margin-top: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="wordmark">HEARD</span>
      </div>
      <h1>Heard needs your microphone</h1>
      <p>Click <b>Allow</b> on the browser prompt so Heard can transcribe your practice. You only have to do this once.</p>
      <button id="retry">Allow microphone</button>
      <p id="status" class="status">Requesting access…</p>
      <p id="hint" class="hint"></p>
    </div>
    <script src="request.js"></script>
  </body>
</html>
