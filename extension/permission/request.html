<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heard — Microphone access</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #fdfcff;
        color: #2a2233;
      }
      .card {
        max-width: 440px;
        text-align: center;
        padding: 32px;
        border: 1px solid #ece7f0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.12);
      }
      h1 { color: #7c3aed; margin: 0 0 8px; }
      p { color: #6b6475; line-height: 1.5; }
      .status { font-weight: 600; margin-top: 16px; }
      .status.ok { color: #16a34a; }
      .status.err { color: #b91c1c; }
      button {
        margin-top: 16px; padding: 10px 18px; border: none; border-radius: 10px;
        background: #7c3aed; color: #fff; font-weight: 600; cursor: pointer; font-size: 14px;
      }
      .hint { font-size: 13px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Heard needs your microphone</h1>
      <p>Click <b>Allow</b> on the browser prompt so Heard can transcribe your practice. You only have to do this once.</p>
      <button id="retry">Allow microphone</button>
      <p id="status" class="status">Requesting access…</p>
      <p id="hint" class="hint"></p>
    </div>
    <script src="request.js"></script>
  </body>
</html>
