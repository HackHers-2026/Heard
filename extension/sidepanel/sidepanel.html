<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="brand-row">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="wordmark">HEARD</span>
      <span id="conn" class="conn" title="Connection status">●</span>
    </header>

    <p class="sub">Record yourself practicing — your words appear live below.</p>

    <div class="controls">
      <button id="start" class="primary">Start recording</button>
      <button id="stop" class="danger" disabled>Stop</button>
      <button id="clear" class="ghost">Clear</button>
    </div>

    <p id="status" class="status">Click “Start recording” and allow microphone access.</p>

    <section class="panel transcript-wrap">
      <div class="panel-head">
        <span class="eyebrow">Transcript</span>
        <span id="meter" class="meter" aria-hidden="true"></span>
      </div>
      <div id="transcript" class="transcript">
        <span class="placeholder">Your live transcript will show up here…</span>
      </div>
    </section>

    <section class="panel feedback-wrap">
      <div class="panel-head">
        <span class="eyebrow">Live Coaching</span>
      </div>
      <div id="coaching" class="coaching">
        <span class="placeholder">
          Your coaching feedback will appear here after the first segment…
        </span>
      </div>
    </section>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
